    let lastRunStatus = null;
    async function checkActionsStatus() {
      try {
        const res = await fetch('/api/actions/status');
        const data = await res.json();
        if (!data.success || !data.run) return;

        const run = data.run;
        const dot = document.getElementById('actionsDot');
        const txt = document.getElementById('actionsText');
        const pill = document.getElementById('actionsStatusPill');
        pill.href = run.html_url || 'https://github.com/DL049/DL049.github.io/actions';

        if (run.status === 'in_progress' || run.status === 'queued') {
          dot.className = 'dot-yellow';
          txt.innerText = 'GitHub 編譯部署中...';
          lastRunStatus = 'building';
          setTimeout(checkActionsStatus, 4000);
        } else if (run.status === 'completed') {
          if (run.conclusion === 'success') {
            dot.className = 'dot-green';
            txt.innerText = '線上已部署更新';
            if (lastRunStatus === 'building') {
              Swal.fire({
                toast: true,
                position: 'top-end',
                icon: 'success',
                title: '🎉 GitHub Actions 編譯完成！新內容已正式上線！',
                timer: 4000,
                showConfirmButton: false
              });
            }
            lastRunStatus = 'success';
          } else {
            dot.className = 'dot-red';
            txt.innerText = '部署失敗 (點擊查看)';
            lastRunStatus = 'failed';
          }
        }
      } catch (e) {}
    }

    // -----------------------------------------------------------------
    // Word Count, Suggestions, Clipboard Upload, Autosave & Shortcuts
    // -----------------------------------------------------------------
    function calculateStats() {
      const text = document.getElementById('editorTextarea').value || '';
      const cjkChars = (text.match(/[\u4e00-\u9fa5\u0800-\u4e00\uac00-\ud7a3]/g) || []).length;
      const nonCjkText = text.replace(/[\u4e00-\u9fa5\u0800-\u4e00\uac00-\ud7a3]/g, ' ');
      const words = (nonCjkText.match(/[a-zA-Z0-9_\-]+/g) || []).length;

      const totalCount = cjkChars + words;
      document.getElementById('wordCount').innerText = `${totalCount.toLocaleString()} 字`;
      const minutes = Math.max(1, Math.ceil(totalCount / 350));
      document.getElementById('readingTime').innerText = `${minutes} 分鐘`;
    }

    function getAllCategories() {
      const set = new Set();
      posts.forEach(p => (p.categories || []).forEach(c => set.add(c)));
      return Array.from(set);
    }

    function getAllTags() {
      const set = new Set();
      posts.forEach(p => (p.tags || []).forEach(t => set.add(t)));
      return Array.from(set);
    }

    function renderCategorySuggestions() {
      const container = document.getElementById('catSuggestions');
      if (!container) return;
      const all = getAllCategories();
      const selected = document.getElementById('fmCategories').value.split(',').map(s => s.trim().toLowerCase());
      container.innerHTML = all.map(cat => {
        const isSelected = selected.includes(cat.toLowerCase());
        return `<span class="chip" onclick="toggleCategory('${escapeHtml(cat)}')">${isSelected ? '✓ ' : ''}${escapeHtml(cat)}</span>`;
      }).join('');
    }

    function toggleCategory(cat) {
      const input = document.getElementById('fmCategories');
      const items = input.value.split(',').map(s => s.trim()).filter(Boolean);
      const idx = items.findIndex(i => i.toLowerCase() === cat.toLowerCase());
      if (idx >= 0) items.splice(idx, 1); else items.push(cat);
      input.value = items.join(', ');
      renderCategorySuggestions();
      hasUnsavedChanges = true;
    }

    function renderTagSuggestions() {
      const container = document.getElementById('tagSuggestions');
      if (!container) return;
      const all = getAllTags();
      const selected = document.getElementById('fmTags').value.split(',').map(s => s.trim().toLowerCase());
      container.innerHTML = all.map(t => {
        const isSelected = selected.includes(t.toLowerCase());
        return `<span class="chip" onclick="toggleTag('${escapeHtml(t)}')">${isSelected ? '✓ ' : ''}#${escapeHtml(t)}</span>`;
      }).join('');
    }

    function toggleTag(tag) {
      const input = document.getElementById('fmTags');
      const items = input.value.split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
      const idx = items.indexOf(tag.toLowerCase());
      if (idx >= 0) items.splice(idx, 1); else items.push(tag.toLowerCase());
      input.value = items.join(', ');
      renderTagSuggestions();
      hasUnsavedChanges = true;
    }

    function setupPasteHandler() {
      const textarea = document.getElementById('editorTextarea');
      textarea.addEventListener('paste', async (e) => {
        const items = (e.clipboardData || e.originalEvent.clipboardData).items;
        for (let item of items) {
          if (item.kind === 'file' && item.type.startsWith('image/')) {
            e.preventDefault();
            const file = item.getAsFile();
            await uploadAndInsertImage(file);
            break;
          }
        }
      });
    }

    function openImageUploadDialog() {
      Swal.fire({
        title: '插入或管理圖片',
        html: `
          <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px;">
            <button class="btn btn-publish" onclick="document.getElementById('imageFileInput').click(); Swal.close();" style="justify-content: center; padding: 10px;">
              <i class="fa-solid fa-arrow-up-from-bracket"></i> 選擇本機圖片上傳
            </button>
            <button class="btn" onclick="Swal.close(); openMediaLibrary(false);" style="justify-content: center; padding: 10px;">
              <i class="fa-regular fa-images"></i> 從現有媒體庫挑選
            </button>
            <div style="font-size: 0.76rem; color: var(--text-muted-color); text-align: center;">或者輸入網路圖片網址：</div>
            <input type="text" id="externalImageUrl" class="search-input" placeholder="https://example.com/image.png">
          </div>
        `,
        showCancelButton: true,
        confirmButtonText: '插入網址圖片',
        cancelButtonText: '取消',
        preConfirm: () => {
          const url = document.getElementById('externalImageUrl').value.trim();
          if (url) insertSyntax(`![圖片說明](${url})`, '');
        }
      });
    }

    async function handleFileInput(event) {
      const file = event.target.files[0];
      if (!file) return;
      await uploadAndInsertImage(file);
      event.target.value = '';
      if (document.getElementById('mediaModal').classList.contains('active')) {
        await loadMediaList();
      }
    }

    async function uploadAndInsertImage(file) {
      const textarea = document.getElementById('editorTextarea');
      const placeholder = `![正在上傳圖片 ${file.name || ''}...]()`;
      const isMediaModalOpen = document.getElementById('mediaModal').classList.contains('active');

      if (!isMediaModalOpen) insertSyntax(placeholder, '');

      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const res = await fetch('/api/upload-image', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ data: e.target.result, filename: file.name })
          });
          const data = await res.json();
          if (data.success) {
            if (!isMediaModalOpen) {
              textarea.value = textarea.value.replace(placeholder, `![${file.name || '圖片說明'}](${data.url})\n`);
              onContentChange();
            }
            Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: '圖片上傳成功！', showConfirmButton: false, timer: 1800 });
          } else {
            if (!isMediaModalOpen) textarea.value = textarea.value.replace(placeholder, '');
            Swal.fire('上傳失敗', data.error, 'error');
          }
        } catch (err) {
          if (!isMediaModalOpen) textarea.value = textarea.value.replace(placeholder, '');
          Swal.fire('上傳出錯', err.message, 'error');
        }
      };
      reader.readAsDataURL(file);
    }

    function tickAutosave() {
      if (!hasUnsavedChanges || !currentPost) return;
      saveSnapshotToStorage();
    }

    function saveSnapshotToStorage() {
      if (!currentPost) return;
      const key = `dlib_autosave_${currentPost.filename}`;
      localStorage.setItem(key, JSON.stringify({
        filename: currentPost.filename,
        title: document.getElementById('fmTitle').value,
        content: document.getElementById('editorTextarea').value,
        isDraft: document.getElementById('fmIsDraft').checked,
        timestamp: Date.now()
      }));
      document.getElementById('saveStatus').innerText = `本地快照已備份 (${new Date().toLocaleTimeString()})`;
    }

    function checkAutosaveSnapshot(filename) {
      const banner = document.getElementById('autosaveBanner');
      const raw = localStorage.getItem(`dlib_autosave_${filename}`);
      if (!raw) { banner.classList.remove('active'); return; }
      try {
        const data = JSON.parse(raw);
        if (data.content && data.content.trim() !== document.getElementById('editorTextarea').value.trim()) {
          document.getElementById('autosaveTime').innerText = new Date(data.timestamp).toLocaleTimeString();
          banner.classList.add('active');
        } else {
          banner.classList.remove('active');
        }
      } catch (e) { banner.classList.remove('active'); }
    }

    function restoreAutosave() {
      if (!currentPost) return;
      const raw = localStorage.getItem(`dlib_autosave_${currentPost.filename}`);
      if (!raw) return;
      try {
        const data = JSON.parse(raw);
        if (data.content) {
          document.getElementById('editorTextarea').value = data.content;
          if (data.title) document.getElementById('fmTitle').value = data.title;
          onContentChange();
          dismissAutosave();
        }
      } catch (e) {}
    }

    function dismissAutosave() { document.getElementById('autosaveBanner').classList.remove('active'); }
    function clearAutosaveSnapshot(filename) {
      localStorage.removeItem(`dlib_autosave_${filename}`);
      dismissAutosave();
    }

    // Keyboard Shortcuts
    function loadSavedShortcuts() {
      const saved = localStorage.getItem('dlib_shortcuts');
      if (saved) {
        try { userShortcuts = Object.assign({}, DEFAULT_SHORTCUTS, JSON.parse(saved)); } catch (e) {}
      }
    }

    function saveShortcutsToStorage() { localStorage.setItem('dlib_shortcuts', JSON.stringify(userShortcuts)); }

    function resetDefaultShortcuts() {
      userShortcuts = JSON.parse(JSON.stringify(DEFAULT_SHORTCUTS));
      saveShortcutsToStorage();
      renderShortcutTable();
    }

    function renderShortcutTable() {
      const tbody = document.getElementById('shortcutTableBody');
      tbody.innerHTML = '';
      for (const [actionKey, shortcut] of Object.entries(userShortcuts)) {
        const tr = document.createElement('tr');
        const isRec = recordingAction === actionKey;
        const parts = [];
        if (shortcut.ctrl) parts.push('Ctrl');
        if (shortcut.alt) parts.push('Alt');
        if (shortcut.shift) parts.push('Shift');
        parts.push(shortcut.key.toUpperCase());

        tr.innerHTML = `
          <td style="color: var(--heading-color);">${escapeHtml(shortcut.name)}</td>
          <td>
            <button class="key-badge ${isRec ? 'recording' : ''}" onclick="recordingAction='${actionKey}'; renderShortcutTable();">
              ${isRec ? '請按鍵盤...' : parts.join(' + ')}
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      }
    }

    function setupGlobalKeybindings() {
      window.addEventListener('keydown', (e) => {
        if (recordingAction) {
          e.preventDefault();
          e.stopPropagation();
          if (['Control', 'Alt', 'Shift', 'Meta'].includes(e.key)) return;
          userShortcuts[recordingAction] = {
            name: userShortcuts[recordingAction].name,
            key: e.key.toLowerCase(),
            ctrl: e.ctrlKey || e.metaKey,
            alt: e.altKey,
            shift: e.shiftKey
          };
          recordingAction = null;
          saveShortcutsToStorage();
          renderShortcutTable();
          return;
        }

        for (const [action, s] of Object.entries(userShortcuts)) {
          if (!!s.ctrl === !!(e.ctrlKey || e.metaKey) &&
              !!s.alt === !!e.altKey &&
              !!s.shift === !!e.shiftKey &&
              s.key.toLowerCase() === e.key.toLowerCase()) {
            e.preventDefault();
            executeShortcutAction(action);
            break;
          }
        }
      });
    }

    function executeShortcutAction(action) {
      if (action === 'save') saveCurrentPost(false);
      else if (action === 'publish') publishToGithub();
      else if (action === 'newPost') createNewDraft();
      else if (action === 'bold') insertSyntax('**', '**');
      else if (action === 'italic') insertSyntax('*', '*');
      else if (action === 'math') insertSyntax('\\[\n', '\n\\]');
      else if (action === 'code') insertSyntax('```\n', '\n```');
      else if (action === 'search') document.getElementById('searchInput').focus();
    }

    function onContentChange() {
      hasUnsavedChanges = true;
      calculateStats();
      renderPreview();
      renderOutlineTOC();
    }

    function onTitleChange() {
      const title = document.getElementById('fmTitle').value;
      document.getElementById('displayTitle').innerText = title || '未命名文章';
      const filenameEl = document.getElementById('fmFilename');
      const isDraft = document.getElementById('fmIsDraft').checked;
      if (!currentPost || currentPost.filename.includes('new-draft') || currentPost.filename.includes('new-post')) {
        const slug = slugify(title);
        filenameEl.value = isDraft ? `${slug || 'draft'}.md` : `${formatDate(new Date()).split(' ')[0]}-${slug || 'post'}.md`;
      }
      hasUnsavedChanges = true;
    }

    function slugify(text) {
      return text.toString().toLowerCase().trim()
        .replace(/\s+/g, '-')
        .replace(/[^\w\u4e00-\u9fa5-]+/g, '')
        .replace(/--+/g, '-');
    }

    function formatDate(d) {
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())} +0800`;
    }

    function setCurrentTime() {
      document.getElementById('fmDate').value = formatDate(new Date());
      hasUnsavedChanges = true;
    }

    function insertSyntax(before, after) {
      const textarea = document.getElementById('editorTextarea');
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const text = textarea.value;
      const selected = text.substring(start, end);

      const replacement = before + (selected || '') + after;
      textarea.value = text.substring(0, start) + replacement + text.substring(end);
      textarea.focus();
      textarea.selectionStart = start + before.length;
      textarea.selectionEnd = start + before.length + selected.length;
      onContentChange();
    }

    function insertTable() {
      insertSyntax('\n| 欄位 1 | 欄位 2 | 欄位 3 |\n| :--- | :--- | :--- |\n| 項目 A | 內容 1 | 數值 |\n| 項目 B | 內容 2 | 數值 |\n\n', '');
    }

    // Publish to GitHub
    async function publishToGithub() {
      await saveCurrentPost(true);

      const cfgRes = await fetch('/api/config');
      const cfgData = await cfgRes.json();
      if (!cfgData.hasToken) {
        const ask = await Swal.fire({
          title: '尚未配置 GitHub Token',
          text: '推送到 GitHub 需要 Personal Access Token 授權，是否現在設定？',
          icon: 'info',
          showCancelButton: true,
          confirmButtonText: '前往設定'
        });
        if (ask.isConfirmed) openSettings();
        return;
      }

      Swal.fire({
        title: '正在推送到 GitHub...',
        html: `<div class="log-box" id="publishLog">正在執行 git add / commit / push...</div>`,
        allowOutsideClick: false,
        showConfirmButton: false,
        didOpen: async () => {
          Swal.showLoading();
          try {
            const res = await fetch('/api/publish', { method: 'POST' });
            const data = await res.json();
            if (data.success) {
              lastRunStatus = 'building';
              setTimeout(checkActionsStatus, 2500);
              Swal.fire({
                icon: 'success',
                title: '🚀 已成功推送至 GitHub！',
                html: `
                  <p style="font-size: 0.85rem; color: var(--text-muted-color);">
                    右上角狀態列將自動監控 GitHub Actions 編譯進度，完成後會即時通知您！
                  </p>
                `,
                timer: 2800
              });
            } else {
              Swal.fire({ icon: 'error', title: '推送失敗', html: `<div class="log-box">${escapeHtml(data.log || data.error)}</div>` });
            }
          } catch (err) {
            Swal.fire('錯誤', err.message, 'error');
          }
        }
      });
    }

    // Settings Modal
    async function openSettings() {
      document.getElementById('settingsModal').classList.add('active');
      switchSettingsTab('github');
      const cfgRes = await fetch('/api/config');
      const cfg = await cfgRes.json();
      if (cfg.success) {
        document.getElementById('cfgRepo').value = cfg.repo || 'DL049/DL049.github.io';
        if (cfg.hasToken) document.getElementById('cfgToken').placeholder = `已配置 (${cfg.maskedToken})`;
      }
      try {
        const gitRes = await fetch('/api/git/status');
        const git = await gitRes.json();
        if (git.success) {
          document.getElementById('gitStatusBox').innerText = `分支: ${git.branch}\n最新 Commit: ${git.lastCommit}\n未提交變更:\n${git.changes || '(無未提交變更)'}`;
        }
      } catch (e) {}
      renderShortcutTable();
    }

    function switchSettingsTab(tab) {
      document.getElementById('modalTabGithub').classList.toggle('active', tab === 'github');
      document.getElementById('modalTabShortcuts').classList.toggle('active', tab !== 'github');
      document.getElementById('settingsPanelGithub').style.display = tab === 'github' ? 'flex' : 'none';
      document.getElementById('settingsPanelShortcuts').style.display = tab === 'github' ? 'none' : 'flex';
      if (tab !== 'github') renderShortcutTable();
    }

    function closeSettings() {
      recordingAction = null;
      document.getElementById('settingsModal').classList.remove('active');
    }

    async function saveGithubSettings() {
      const repo = document.getElementById('cfgRepo').value.trim();
      const token = document.getElementById('cfgToken').value.trim();
      const payload = { repo };
      if (token) payload.githubToken = token;
      const res = await fetch('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (data.success) {
        Swal.fire('成功', '設定已儲存', 'success');
        closeSettings();
      }
    }

    async function checkPreviewStatus() {
      try {
        const res = await fetch('/api/preview/status');
        const data = await res.json();
        isJekyllRunning = data.running;
        const btn = document.getElementById('btnPreviewToggle');
        btn.innerHTML = data.running
          ? `<i class="fa-solid fa-stop" style="color: #ef4444;"></i>`
          : `<i class="fa-solid fa-play" style="color: #10b981;"></i>`;
      } catch (e) {}
    }

    async function toggleJekyllPreview() {
      const endpoint = isJekyllRunning ? '/api/preview/stop' : '/api/preview/start';
      const res = await fetch(endpoint, { method: 'POST' });
      const data = await res.json();
      if (data.success) {
        await checkPreviewStatus();
        if (isJekyllRunning) {
          Swal.fire({
            icon: 'info',
            title: 'Jekyll 全站預覽已啟動',
            html: `請訪問：<a href="http://127.0.0.1:4000" target="_blank" style="color: var(--link-color);">http://127.0.0.1:4000</a>`,
            timer: 4000
          });
        }
      }
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
