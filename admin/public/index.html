<!DOCTYPE html>
<html lang="zh-TW" data-mode="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D-Lib Admin | 部落格管理後台</title>

  <!-- Google Fonts: Lato, Source Sans 3, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Lato:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <!-- FontAwesome 6 (Chirpy's exact icon system) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Markdown, KaTeX & Highlight.js -->
  <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="highlightTheme">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    /* -------------------------------------------------------------
       Jekyll Chirpy Theme System Variables (Exact replica)
    ------------------------------------------------------------- */
    :root {
      font-size: 16px;
    }

    /* Chirpy Dark Mode (Default) */
    html[data-mode="dark"] {
      color-scheme: dark;
      --main-bg: rgb(27, 27, 30);
      --sidebar-bg: #1e1e1e;
      --sidebar-border-color: #292929;
      --sidebar-muted-color: #868686;
      --sidebar-active-color: rgb(255, 255, 255, 0.95);
      --sidebar-hover-bg: #262626;
      --card-bg: #1e1e1e;
      --card-hover-bg: #282828;
      --card-shadow: rgb(21, 21, 21, 0.72) 0 6px 18px 0, rgb(137, 135, 135, 0.24) 0 0 0 1px;
      --main-border-color: rgb(44, 45, 45);
      --text-color: rgb(175, 176, 177);
      --text-muted-color: #868686;
      --heading-color: #cccccc;
      --link-color: rgb(138, 180, 248);
      --link-underline-color: rgb(82, 108, 150);
      --tag-border: rgb(59, 79, 88);
      --tag-hover: rgb(43, 56, 62);
      --btn-border-color: #2e2f31;
      --highlight-bg-color: #151515;
      --inline-code-bg: rgba(255, 255, 255, 0.06);
      --code-color: #b0b0b0;
      --tb-odd-bg: #252526;
      --tb-even-bg: rgb(31, 31, 34);
      --tb-border-color: var(--tb-odd-bg);
      --avatar-border-color: rgb(206, 206, 206, 0.9);
      --input-bg: #151517;
      --topbar-bg: rgba(27, 27, 30, 0.75);
      --prompt-tip-bg: rgba(22, 60, 36, 0.64);
      --prompt-tip-color: #0fa40f;
    }

    /* Chirpy Light Mode */
    html[data-mode="light"] {
      color-scheme: light;
      --main-bg: #ffffff;
      --sidebar-bg: #f6f8fa;
      --sidebar-border-color: #efefef;
      --sidebar-muted-color: #545454;
      --sidebar-active-color: #1d1d1d;
      --sidebar-hover-bg: rgb(223, 233, 241, 0.64);
      --card-bg: #ffffff;
      --card-hover-bg: #f8f9fa;
      --card-shadow: rgb(104, 104, 104, 0.05) 0 2px 6px 0, rgba(211, 209, 209, 0.15) 0 0 0 1px;
      --main-border-color: #f3f3f3;
      --text-color: #34343c;
      --text-muted-color: #757575;
      --heading-color: #2a2a2a;
      --link-color: #0056b2;
      --link-underline-color: #dee2e6;
      --tag-border: #dee2e6;
      --tag-hover: rgb(222, 226, 230);
      --btn-border-color: #e9ecef;
      --highlight-bg-color: #f6f8fa;
      --inline-code-bg: rgba(25, 25, 28, 0.05);
      --code-color: #3a3a3a;
      --tb-odd-bg: #fbfcfd;
      --tb-even-bg: #ffffff;
      --tb-border-color: #eaeaea;
      --avatar-border-color: #ffffff;
      --input-bg: #f8fafc;
      --topbar-bg: rgba(255, 255, 255, 0.85);
      --prompt-tip-bg: rgba(123, 247, 144, 0.2);
      --prompt-tip-color: #03b303;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Source Sans 3', 'Microsoft Yahei', sans-serif;
      background: var(--main-bg);
      color: var(--text-color);
      display: flex;
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, h4, h5, .site-title, .brand-title {
      font-family: 'Lato', 'Microsoft Yahei', sans-serif;
      color: var(--heading-color);
    }

    /* -------------------------------------------------------------
       Sidebar - Chirpy Profile & Navigation
    ------------------------------------------------------------- */
    .sidebar {
      width: 310px;
      min-width: 310px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--sidebar-border-color);
      display: flex;
      flex-direction: column;
      height: 100%;
      user-select: none;
    }

    .profile-wrapper {
      padding: 24px 20px 16px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      border-bottom: 1px solid var(--sidebar-border-color);
    }
    .profile-avatar {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      border: 2px solid var(--avatar-border-color);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      margin-bottom: 12px;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    .profile-avatar:hover { transform: scale(1.05); }

    .site-title {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--heading-color);
      text-decoration: none;
      line-height: 1.2;
    }
    .site-subtitle {
      font-size: 0.82rem;
      font-style: italic;
      color: var(--sidebar-muted-color);
      margin-top: 5px;
    }

    .sidebar-actions {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-chirpy-new {
      background: var(--link-color);
      color: #ffffff;
      border: none;
      border-radius: 20px;
      padding: 9px 16px;
      font-weight: 600;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      transition: all 0.2s;
    }
    html[data-mode="dark"] .btn-chirpy-new { color: #1b1b1e; }
    .btn-chirpy-new:hover { opacity: 0.9; transform: translateY(-1px); }

    .search-wrapper {
      position: relative;
    }
    .search-input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--btn-border-color);
      color: var(--text-color);
      padding: 7px 12px 7px 34px;
      border-radius: 20px;
      font-size: 0.82rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus { border-color: var(--link-color); }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--sidebar-muted-color);
      font-size: 0.78rem;
    }

    /* Post Cards List */
    .post-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .post-card {
      padding: 12px 14px;
      border-radius: 10px;
      background: var(--card-bg);
      border: 1px solid var(--sidebar-border-color);
      box-shadow: var(--card-shadow);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .post-card:hover {
      background: var(--card-hover-bg);
      transform: translateY(-1px);
    }
    .post-card.active {
      border-left: 4px solid var(--link-color);
      background: var(--card-hover-bg);
    }
    .post-card-title {
      font-family: 'Lato', sans-serif;
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--heading-color);
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .post-card-meta {
      font-size: 0.73rem;
      color: var(--text-muted-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .chirpy-tag {
      display: inline-block;
      border-radius: 6px;
      border: 1px solid var(--tag-border);
      padding: 1px 6px;
      color: var(--text-muted-color);
      font-size: 0.68rem;
    }

    /* Sidebar Bottom Footer (Chirpy signature toggle) */
    .sidebar-bottom {
      padding: 12px 16px;
      border-top: 1px solid var(--sidebar-border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--sidebar-muted-color);
      font-size: 0.82rem;
    }
    .sidebar-btn {
      background: transparent;
      border: none;
      color: var(--sidebar-muted-color);
      cursor: pointer;
      padding: 6px 9px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .sidebar-btn:hover { color: var(--heading-color); background: var(--sidebar-hover-bg); }

    /* -------------------------------------------------------------
       Main Area (Chirpy Layout)
    ------------------------------------------------------------- */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
      background: var(--main-bg);
    }

    /* Frosted Topbar */
    .topbar {
      height: 58px;
      background: var(--topbar-bg);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--main-border-color);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
      color: var(--text-muted-color);
    }
    .breadcrumb strong { color: var(--heading-color); max-width: 400px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Buttons */
    .btn {
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      border: 1px solid var(--btn-border-color);
      background: var(--card-bg);
      color: var(--text-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn:hover { background: var(--card-hover-bg); }
    .btn-publish {
      background: var(--link-color);
      border-color: var(--link-color);
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }
    html[data-mode="dark"] .btn-publish { color: #1b1b1e; }
    .btn-publish:hover { opacity: 0.92; transform: translateY(-1px); }
    .btn-delete {
      color: #ef4444;
      border-color: rgba(239, 68, 68, 0.3);
    }
    .btn-delete:hover { background: rgba(239, 68, 68, 0.12); }

    /* Metadata Bar */
    .meta-bar {
      background: var(--sidebar-bg);
      border-bottom: 1px solid var(--main-border-color);
      padding: 12px 24px;
      display: grid;
      grid-template-columns: 2fr 1.2fr 1fr 1fr;
      gap: 12px;
      align-items: end;
    }
    .meta-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .meta-field label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted-color);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .meta-field input {
      background: var(--input-bg);
      border: 1px solid var(--btn-border-color);
      color: var(--text-color);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .meta-field input:focus { border-color: var(--link-color); }
    .meta-options {
      display: flex;
      gap: 14px;
      align-items: center;
      padding-bottom: 6px;
    }
    .chirpy-checkbox {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      user-select: none;
      color: var(--text-color);
    }

    /* Editor Toolbar */
    .editor-toolbar {
      padding: 6px 24px;
      background: var(--main-bg);
      border-bottom: 1px solid var(--main-border-color);
      display: flex;
      align-items: center;
      gap: 3px;
      overflow-x: auto;
    }
    .tool-btn {
      background: transparent;
      border: none;
      color: var(--text-muted-color);
      padding: 6px 9px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .tool-btn:hover { background: var(--card-hover-bg); color: var(--heading-color); }
    .tool-sep {
      width: 1px;
      height: 16px;
      background: var(--main-border-color);
      margin: 0 4px;
    }

    /* Dual Workspace */
    .workspace {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    .pane {
      flex: 1;
      height: 100%;
      overflow-y: auto;
    }
    .editor-pane {
      border-right: 1px solid var(--main-border-color);
      background: var(--highlight-bg-color);
    }
    .editor-textarea {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      padding: 24px;
      color: var(--text-color);
      font-family: 'JetBrains Mono', Consolas, monospace;
      font-size: 0.9rem;
      line-height: 1.65;
    }

    /* -------------------------------------------------------------
       Chirpy Post Content Preview Styling (Exact Replica)
    ------------------------------------------------------------- */
    .preview-pane {
      background: var(--main-bg);
      padding: 32px 42px;
    }
    .chirpy-content {
      color: var(--text-color);
      line-height: 1.75;
      font-size: 1.02rem;
      max-width: 820px;
      margin: 0 auto;
    }
    .chirpy-content h1, .chirpy-content h2, .chirpy-content h3, .chirpy-content h4 {
      font-family: 'Lato', sans-serif;
      color: var(--heading-color);
      font-weight: 700;
      margin-top: 2rem;
      margin-bottom: 0.8rem;
    }
    .chirpy-content h1 { font-size: 1.85rem; border-bottom: 1px solid var(--main-border-color); padding-bottom: 8px; }
    .chirpy-content h2 { font-size: 1.45rem; border-bottom: 1px solid var(--main-border-color); padding-bottom: 6px; }
    .chirpy-content h3 { font-size: 1.25rem; }
    .chirpy-content p { margin-bottom: 1.2rem; }
    .chirpy-content a { color: var(--link-color); border-bottom: 1px solid var(--link-underline-color); text-decoration: none; }
    .chirpy-content a:hover { border-bottom-color: var(--link-color); }
    
    .chirpy-content blockquote {
      border-left: 0.25rem solid var(--link-color);
      padding: 0.5rem 1rem;
      color: var(--text-muted-color);
      margin: 1.2rem 0;
      background: var(--inline-code-bg);
      border-radius: 0 8px 8px 0;
    }
    .chirpy-content blockquote p { margin-bottom: 0; }

    /* Chirpy Prompt box */
    .prompt-box {
      border-left: 0;
      position: relative;
      padding: 0.85rem 1rem 0.85rem 3rem;
      border-radius: 8px;
      margin: 1.2rem 0;
      background-color: var(--prompt-tip-bg);
      color: var(--text-color);
    }
    .prompt-box::before {
      content: "\f0eb";
      font-family: "Font Awesome 6 Free";
      font-weight: 900;
      position: absolute;
      left: 1rem;
      top: 0.85rem;
      color: var(--prompt-tip-color);
    }

    /* Chirpy Code block with header */
    .chirpy-content pre {
      background: var(--highlight-bg-color);
      border-radius: 10px;
      padding: 16px;
      overflow-x: auto;
      margin-bottom: 1.2rem;
      border: 1px solid var(--main-border-color);
      position: relative;
    }
    .chirpy-content pre::before {
      content: "";
      display: block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #444;
      box-shadow: 16px 0 0 #444, 32px 0 0 #444;
      margin-bottom: 12px;
    }
    .chirpy-content code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.86rem;
      background-color: var(--inline-code-bg);
      color: var(--code-color);
      padding: 2px 6px;
      border-radius: 6px;
    }
    .chirpy-content pre code {
      background: transparent;
      padding: 0;
      display: block;
    }

    .chirpy-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.4rem 0;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--main-border-color);
    }
    .chirpy-content th, .chirpy-content td {
      padding: 8px 14px;
      text-align: left;
      border-bottom: 1px solid var(--main-border-color);
    }
    .chirpy-content th { background: var(--sidebar-bg); color: var(--heading-color); font-weight: 600; }
    .chirpy-content tr:nth-child(even) { background-color: var(--tb-even-bg); }

    /* KaTeX Math Styling */
    .katex-display {
      margin: 1.4rem 0 !important;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 10px 0;
      text-align: center;
    }
    .katex {
      font-size: 1.08em;
      line-height: 1.2;
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-card {
      background: var(--sidebar-bg);
      border: 1px solid var(--main-border-color);
      border-radius: 12px;
      width: 480px;
      max-width: 90vw;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .log-box {
      background: var(--highlight-bg-color);
      border: 1px solid var(--main-border-color);
      border-radius: 6px;
      padding: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      max-height: 200px;
      overflow-y: auto;
      white-space: pre-wrap;
      color: var(--text-muted-color);
      margin: 12px 0;
    }
  </style>
</head>
<body>

  <!-- Left Sidebar (Chirpy Style) -->
  <aside class="sidebar">
    <div class="profile-wrapper">
      <img src="https://avatars.githubusercontent.com/u/75907889?v=4" class="profile-avatar" alt="avatar">
      <a href="/" class="site-title">D-Lib</a>
      <p class="site-subtitle">這裏會放各種奇奇怪怪的東西</p>
    </div>

    <div class="sidebar-actions">
      <button class="btn-chirpy-new" onclick="createNewPost()">
        <i class="fa-solid fa-feather-pointed"></i> 寫新文章
      </button>
      <div class="search-wrapper">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="searchInput" class="search-input" placeholder="搜尋標題、標籤..." oninput="filterPosts()">
      </div>
    </div>

    <!-- Post list cards -->
    <div class="post-list" id="postList">
      <!-- Injected by JavaScript -->
    </div>

    <!-- Chirpy Signature Bottom Bar -->
    <div class="sidebar-bottom">
      <button class="sidebar-btn" id="modeToggle" onclick="toggleThemeMode()" title="切換深色 / 淺色模式">
        <i class="fa-solid fa-circle-half-stroke"></i>
      </button>
      <span id="postCount">0 篇文章</span>
      <div style="display: flex; gap: 4px;">
        <button class="sidebar-btn" onclick="toggleJekyllPreview()" id="btnPreviewToggle" title="啟動/關閉本地 Jekyll 全站預覽">
          <i class="fa-solid fa-play"></i>
        </button>
        <button class="sidebar-btn" onclick="openSettings()" title="GitHub Token 與設定">
          <i class="fa-solid fa-gear"></i>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main Content Workspace -->
  <main class="main">
    <!-- Frosted Topbar -->
    <header class="topbar">
      <div class="breadcrumb">
        <span><i class="fa-regular fa-folder-open"></i> POSTS</span>
        <span>/</span>
        <strong id="displayTitle">未命名文章</strong>
        <span id="saveStatus" style="font-size: 0.75rem; color: var(--text-muted-color); margin-left: 6px;"></span>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-delete" onclick="deleteCurrentPost()" id="btnDelete" title="刪除此文章">
          <i class="fa-regular fa-trash-can"></i> 刪除
        </button>
        <button class="btn" onclick="saveCurrentPost(false)">
          <i class="fa-regular fa-floppy-disk"></i> 儲存草稿
        </button>
        <button class="btn btn-publish" onclick="publishToGithub()">
          <i class="fa-solid fa-cloud-arrow-up"></i> 一鍵發布至 GitHub
        </button>
      </div>
    </header>

    <!-- Metadata Bar -->
    <div class="meta-bar">
      <div class="meta-field">
        <label>文章標題</label>
        <input type="text" id="fmTitle" placeholder="例如：投影學的數學建模：通用投影" oninput="onTitleChange()">
      </div>
      <div class="meta-field">
        <label>檔案名稱 (Slug)</label>
        <input type="text" id="fmFilename" placeholder="YYYY-MM-DD-title.md">
      </div>
      <div class="meta-field">
        <label>分類 (逗號分隔)</label>
        <input type="text" id="fmCategories" placeholder="Derivation">
      </div>
      <div class="meta-field">
        <label>標籤 (逗號分隔)</label>
        <input type="text" id="fmTags" placeholder="mathematic, graphic">
      </div>
      <div class="meta-field" style="grid-column: span 2;">
        <label>發布日期</label>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="fmDate" style="flex: 1;" placeholder="YYYY-MM-DD HH:mm:ss +0800">
          <button class="btn" style="padding: 4px 12px; font-size: 0.75rem;" onclick="setCurrentTime()">現在</button>
        </div>
      </div>
      <div class="meta-options" style="grid-column: span 2;">
        <label class="chirpy-checkbox">
          <input type="checkbox" id="fmMath" checked onchange="renderPreview()">
          LaTeX 數學公式 (math: true)
        </label>
        <label class="chirpy-checkbox">
          <input type="checkbox" id="fmToc" checked>
          顯示目錄 (toc: true)
        </label>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="editor-toolbar">
      <button class="tool-btn" onclick="insertSyntax('**', '**')" title="粗體"><i class="fa-solid fa-bold"></i></button>
      <button class="tool-btn" onclick="insertSyntax('*', '*')" title="斜體"><i class="fa-solid fa-italic"></i></button>
      <div class="tool-sep"></div>
      <button class="tool-btn" onclick="insertSyntax('## ', '')" title="標題 2"><i class="fa-solid fa-heading"></i>2</button>
      <button class="tool-btn" onclick="insertSyntax('### ', '')" title="標題 3"><i class="fa-solid fa-heading"></i>3</button>
      <div class="tool-sep"></div>
      <button class="tool-btn" onclick="insertSyntax('> ', '')" title="引用"><i class="fa-solid fa-quote-left"></i></button>
      <button class="tool-btn" onclick="insertSyntax('`', '`')" title="行內程式碼"><i class="fa-solid fa-code"></i></button>
      <button class="tool-btn" onclick="insertSyntax('```\n', '\n```')" title="程式碼區塊"><i class="fa-solid fa-file-code"></i></button>
      <button class="tool-btn" onclick="insertSyntax('\\[\n', '\n\\]')" title="LaTeX 數學公式區塊"><i class="fa-solid fa-square-root-variable"></i></button>
      <div class="tool-sep"></div>
      <button class="tool-btn" onclick="insertSyntax('- ', '')" title="無序清單"><i class="fa-solid fa-list-ul"></i></button>
      <button class="tool-btn" onclick="insertSyntax('[連結文字](', 'https://)')" title="超連結"><i class="fa-solid fa-link"></i></button>
      <button class="tool-btn" onclick="insertSyntax('![圖片說明](', '/assets/img/...)')" title="圖片"><i class="fa-regular fa-image"></i></button>
      <button class="tool-btn" onclick="insertTable()" title="表格"><i class="fa-solid fa-table"></i></button>
      <button class="tool-btn" onclick="insertSyntax('> [!TIP]\n> ', '')" title="提示框 (Prompt Tip)"><i class="fa-regular fa-lightbulb"></i></button>
    </div>

    <!-- Dual Workspace -->
    <div class="workspace">
      <!-- Editor -->
      <div class="pane editor-pane">
        <textarea id="editorTextarea" class="editor-textarea" placeholder="在此輸入 Markdown 內容..." oninput="onContentChange()"></textarea>
      </div>

      <!-- Chirpy Preview -->
      <div class="pane preview-pane" id="previewPane">
        <div class="chirpy-content" id="previewContent"></div>
      </div>
    </div>
  </main>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3><i class="fa-solid fa-gear" style="margin-right: 6px;"></i> GitHub 發布設定</h3>
        <button class="sidebar-btn" onclick="closeSettings()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <div class="meta-field">
          <label>GitHub 儲存庫 (User/Repo)</label>
          <input type="text" id="cfgRepo" value="DL049/DL049.github.io">
        </div>
        <div class="meta-field">
          <label>Personal Access Token (PAT)</label>
          <input type="password" id="cfgToken" placeholder="ghp_xxxxxxxxxxxx">
          <span style="font-size: 0.75rem; color: var(--text-muted-color); margin-top: 4px;">
            Token 僅儲存在本機 `admin/config.json`（已受 `.gitignore` 保護，絕不上傳）。
          </span>
        </div>
        <div class="log-box" id="gitStatusBox">正在讀取 Git 狀態...</div>
        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px;">
          <button class="btn" onclick="closeSettings()">取消</button>
          <button class="btn btn-publish" onclick="saveSettings()">儲存設定</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // State
    let posts = [];
    let currentPost = null;
    let isJekyllRunning = false;

    // Theme Mode
    function toggleThemeMode() {
      const html = document.documentElement;
      const current = html.getAttribute('data-mode') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-mode', next);
      localStorage.setItem('dlib-admin-theme', next);
      
      const themeLink = document.getElementById('highlightTheme');
      if (next === 'light') {
        themeLink.href = 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css';
      } else {
        themeLink.href = 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css';
      }
    }

    // Load Saved Theme
    const savedTheme = localStorage.getItem('dlib-admin-theme') || 'dark';
    document.documentElement.setAttribute('data-mode', savedTheme);

    // Configure Marked.js
    marked.setOptions({
      highlight: function(code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          return hljs.highlight(code, { language: lang }).value;
        }
        return hljs.highlightAuto(code).value;
      },
      breaks: true
    });

    // Initialize
    window.addEventListener('DOMContentLoaded', async () => {
      await loadPosts();
      await checkPreviewStatus();

      // Keyboard shortcuts (Ctrl+S to save)
      document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 's') {
          e.preventDefault();
          saveCurrentPost(false);
        }
      });
    });

    // Load Posts
    async function loadPosts() {
      try {
        const res = await fetch('/api/posts');
        const data = await res.json();
        if (data.success) {
          posts = data.posts;
          renderPostList();
          if (posts.length > 0 && !currentPost) {
            selectPost(posts[0].filename);
          }
        }
      } catch (err) {
        console.error(err);
      }
    }

    // Render Post List
    function renderPostList(filter = '') {
      const listEl = document.getElementById('postList');
      listEl.innerHTML = '';

      const filtered = posts.filter(p => {
        const q = filter.toLowerCase();
        return p.title.toLowerCase().includes(q) || 
               p.tags.some(t => t.toLowerCase().includes(q)) ||
               p.filename.toLowerCase().includes(q);
      });

      document.getElementById('postCount').innerText = `${filtered.length} 篇文章`;

      filtered.forEach(p => {
        const div = document.createElement('div');
        div.className = `post-card ${currentPost && currentPost.filename === p.filename ? 'active' : ''}`;
        div.onclick = () => selectPost(p.filename);

        const tagsHtml = p.tags.map(t => `<span class="chirpy-tag">#${t}</span>`).join(' ');

        div.innerHTML = `
          <div class="post-card-title">${escapeHtml(p.title)}</div>
          <div class="post-card-meta">
            <span><i class="fa-regular fa-calendar" style="margin-right: 4px;"></i>${p.date ? p.date.split(' ')[0] : p.filename.slice(0, 10)}</span>
            <div style="flex: 1;"></div>
            ${tagsHtml}
          </div>
        `;
        listEl.appendChild(div);
      });
    }

    function filterPosts() {
      const q = document.getElementById('searchInput').value;
      renderPostList(q);
    }

    // Select Post
    async function selectPost(filename) {
      try {
        const res = await fetch(`/api/posts/${encodeURIComponent(filename)}`);
        const data = await res.json();
        if (data.success) {
          currentPost = data.post;
          populateEditor(currentPost);
          renderPostList(document.getElementById('searchInput').value);
          document.getElementById('btnDelete').style.display = 'flex';
        }
      } catch (err) {
        Swal.fire('錯誤', '讀取文章失敗: ' + err.message, 'error');
      }
    }

    // Populate Editor
    function populateEditor(post) {
      const fm = post.frontmatter || {};
      document.getElementById('fmTitle').value = fm.title || '';
      document.getElementById('displayTitle').innerText = fm.title || post.filename;
      document.getElementById('fmFilename').value = post.filename || '';
      document.getElementById('fmCategories').value = Array.isArray(fm.categories) ? fm.categories.join(', ') : (fm.categories || '');
      document.getElementById('fmTags').value = Array.isArray(fm.tags) ? fm.tags.join(', ') : (fm.tags || '');
      document.getElementById('fmDate').value = fm.date || '';
      document.getElementById('fmMath').checked = fm.math !== false;
      document.getElementById('fmToc').checked = fm.toc !== false;
      document.getElementById('editorTextarea').value = post.content || '';

      renderPreview();
    }

    // Create New Post
    function createNewPost() {
      const now = new Date();
      const dateStr = formatDate(now);
      const dayPrefix = dateStr.split(' ')[0];

      currentPost = {
        filename: `${dayPrefix}-new-post.md`,
        frontmatter: {
          title: '未命名新文章',
          date: dateStr,
          categories: ['General'],
          tags: ['blog'],
          math: true,
          toc: true
        },
        content: '## 前言\n\n在此開始撰寫您的部落格內容...\n'
      };

      populateEditor(currentPost);
      document.getElementById('btnDelete').style.display = 'none';
      renderPostList();
    }

    // Save Post
    async function saveCurrentPost(silent = false) {
      const title = document.getElementById('fmTitle').value.trim() || '未命名文章';
      let filename = document.getElementById('fmFilename').value.trim();
      if (!filename) {
        filename = `${formatDate(new Date()).split(' ')[0]}-post.md`;
      }
      if (!filename.endsWith('.md')) filename += '.md';

      const categories = document.getElementById('fmCategories').value
        .split(',')
        .map(s => s.trim())
        .filter(Boolean);

      const tags = document.getElementById('fmTags').value
        .split(',')
        .map(s => s.trim().toLowerCase())
        .filter(Boolean);

      const payload = {
        originalFilename: currentPost ? currentPost.filename : null,
        filename,
        frontmatter: {
          title,
          date: document.getElementById('fmDate').value.trim() || formatDate(new Date()),
          categories,
          tags,
          math: document.getElementById('fmMath').checked,
          toc: document.getElementById('fmToc').checked
        },
        content: document.getElementById('editorTextarea').value
      };

      try {
        const res = await fetch('/api/posts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.success) {
          currentPost.filename = data.filename;
          document.getElementById('fmFilename').value = data.filename;
          document.getElementById('displayTitle').innerText = title;
          document.getElementById('saveStatus').innerText = `已儲存 (${new Date().toLocaleTimeString()})`;
          await loadPosts();
          if (!silent) {
            Swal.fire({
              toast: true,
              position: 'top-end',
              icon: 'success',
              title: '文章已儲存至本地！',
              showConfirmButton: false,
              timer: 2000
            });
          }
        } else {
          Swal.fire('儲存失敗', data.error, 'error');
        }
      } catch (err) {
        Swal.fire('錯誤', err.message, 'error');
      }
    }

    // Delete Current Post
    async function deleteCurrentPost() {
      if (!currentPost || !currentPost.filename) return;

      const confirm = await Swal.fire({
        title: '確定要刪除這篇文章嗎？',
        text: `將永久刪除檔案: ${currentPost.filename}`,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#ef4444',
        cancelButtonColor: '#334155',
        confirmButtonText: '確定刪除',
        cancelButtonText: '取消'
      });

      if (!confirm.isConfirmed) return;

      try {
        const res = await fetch(`/api/posts/${encodeURIComponent(currentPost.filename)}`, { method: 'DELETE' });
        const data = await res.json();
        if (data.success) {
          Swal.fire('已刪除', '文章檔案已成功移除', 'success');
          currentPost = null;
          await loadPosts();
          if (posts.length === 0) createNewPost();
        } else {
          Swal.fire('刪除失敗', data.error, 'error');
        }
      } catch (err) {
        Swal.fire('錯誤', err.message, 'error');
      }
    }

    // Publish to GitHub
    async function publishToGithub() {
      await saveCurrentPost(true);

      const cfgRes = await fetch('/api/config');
      const cfgData = await cfgRes.json();
      if (!cfgData.hasToken) {
        const ask = await Swal.fire({
          title: '尚未配置 GitHub Token',
          html: `推送到 GitHub 需要 Personal Access Token 授權。<br>您是否要現在設定？`,
          icon: 'info',
          showCancelButton: true,
          confirmButtonText: '前往設定 Token',
          cancelButtonText: '稍後再說'
        });
        if (ask.isConfirmed) openSettings();
        return;
      }

      Swal.fire({
        title: '正在發布到 GitHub...',
        html: `
          <div style="font-size: 0.88rem; color: var(--text-muted-color); margin-bottom: 12px;">
            正在執行 Git 暫存、建立 Commit 並推送到遠端儲存庫...
          </div>
          <div class="log-box" id="publishLog">執行中...</div>
        `,
        allowOutsideClick: false,
        showConfirmButton: false,
        didOpen: async () => {
          Swal.showLoading();
          try {
            const res = await fetch('/api/publish', { method: 'POST' });
            const data = await res.json();
            const logBox = document.getElementById('publishLog');
            if (logBox) logBox.innerText = data.log || '';

            if (data.success) {
              Swal.fire({
                icon: 'success',
                title: '🎉 發布成功！',
                html: `
                  <p>文章已順利推送到 GitHub！</p>
                  <p style="font-size: 0.82rem; color: var(--text-muted-color); margin-top: 8px;">
                    GitHub Actions 將在 1~2 分鐘內自動完成編譯上線。
                  </p>
                  <div style="margin-top: 16px; display: flex; gap: 10px; justify-content: center;">
                    <a href="https://${cfgData.repo}" target="_blank" class="btn btn-publish" style="text-decoration: none;">訪問線上網站</a>
                    <a href="https://github.com/${cfgData.repo}/actions" target="_blank" class="btn" style="text-decoration: none;">查看部署進度</a>
                  </div>
                `
              });
            } else {
              Swal.fire({
                icon: 'error',
                title: '發布失敗',
                html: `<div class="log-box">${escapeHtml(data.log || data.error)}</div>`
              });
            }
          } catch (err) {
            Swal.fire('錯誤', err.message, 'error');
          }
        }
      });
    }

    // Live Render Preview with Math & Highlight
    function renderPreview() {
      let rawMarkdown = document.getElementById('editorTextarea').value;
      const previewEl = document.getElementById('previewContent');
      const enableMath = document.getElementById('fmMath').checked && typeof katex !== 'undefined';

      // 1. Convert prompt syntax if present
      rawMarkdown = rawMarkdown.replace(/^>\s*\[!TIP\]\s*\n((?:>.*\n?)*)/gm, (match, p1) => {
        const clean = p1.replace(/^>\s?/gm, '');
        return `<div class="prompt-box">${clean}</div>\n`;
      });

      const mathBlocks = [];
      const codeBlocks = [];

      function cleanFormula(formula) {
        let f = formula.trim();
        // 移除因轉義殘留的尾部反斜線
        f = f.replace(/\\+$/, '');
        // 將 Kramdown 的雙反斜線指令還原為標準 LaTeX 指令（如 \\frac -> \frac, \\tag -> \tag）
        f = f.replace(/\\\\([a-zA-Z]+)/g, '\\$1');
        // 還原矩陣中的雙換行符
        f = f.replace(/\\\\\\\\/g, '\\\\');
        return f;
      }

      if (enableMath) {
        // Protect multi-line code blocks
        rawMarkdown = rawMarkdown.replace(/```[\s\S]*?```/g, match => {
          const id = `CODEBLOCKPLACEHOLDER${codeBlocks.length}END`;
          codeBlocks.push(match);
          return id;
        });

        // Protect inline code
        rawMarkdown = rawMarkdown.replace(/`[^`\n]+`/g, match => {
          const id = `CODEBLOCKPLACEHOLDER${codeBlocks.length}END`;
          codeBlocks.push(match);
          return id;
        });

        // Extract Block Math: \\[ ... \\] 或 \\\\[ ... \\\\]
        rawMarkdown = rawMarkdown.replace(/\\{1,2}\[([\s\S]*?)\\{1,2}\]/g, (match, code) => {
          const id = `MATHBLOCKPLACEHOLDER${mathBlocks.length}END`;
          mathBlocks.push({ code: cleanFormula(code), display: true });
          return id;
        });

        // Extract Block Math: $$ ... $$
        rawMarkdown = rawMarkdown.replace(/\$\$([\s\S]*?)\$\$/g, (match, code) => {
          const id = `MATHBLOCKPLACEHOLDER${mathBlocks.length}END`;
          mathBlocks.push({ code: cleanFormula(code), display: true });
          return id;
        });

        // Extract Inline Math: \\( ... \\) 或 \\\\( ... \\\\)
        rawMarkdown = rawMarkdown.replace(/\\{1,2}\(([\s\S]*?)\\{1,2}\)/g, (match, code) => {
          const id = `MATHINLINEPLACEHOLDER${mathBlocks.length}END`;
          mathBlocks.push({ code: cleanFormula(code), display: false });
          return id;
        });

        // Extract Inline Math: $ ... $
        rawMarkdown = rawMarkdown.replace(/\$([^\$\n]+?)\$/g, (match, code) => {
          const id = `MATHINLINEPLACEHOLDER${mathBlocks.length}END`;
          mathBlocks.push({ code: cleanFormula(code), display: false });
          return id;
        });

        // Restore code blocks for marked to render
        codeBlocks.forEach((code, i) => {
          rawMarkdown = rawMarkdown.replace(`CODEBLOCKPLACEHOLDER${i}END`, code);
        });
      }

      // 2. Render Markdown via marked
      let html = marked.parse(rawMarkdown);

      // 3. Restore and render Math via KaTeX
      if (enableMath && mathBlocks.length > 0) {
        mathBlocks.forEach((item, i) => {
          const token = item.display ? `MATHBLOCKPLACEHOLDER${i}END` : `MATHINLINEPLACEHOLDER${i}END`;
          let renderedMath;
          try {
            renderedMath = katex.renderToString(item.code, {
              displayMode: item.display,
              throwOnError: false
            });
          } catch (e) {
            renderedMath = `<span style="color:#ef4444;">[LaTeX 格式錯誤: ${escapeHtml(e.message)}]</span>`;
          }

          if (item.display) {
            html = html.replace(`<p>${token}</p>`, `<div class="katex-display">${renderedMath}</div>`);
            html = html.replace(token, `<div class="katex-display">${renderedMath}</div>`);
          } else {
            html = html.replace(token, renderedMath);
          }
        });
      }

      previewEl.innerHTML = html;
    }

    function onContentChange() { renderPreview(); }

    function onTitleChange() {
      const title = document.getElementById('fmTitle').value;
      document.getElementById('displayTitle').innerText = title || '未命名文章';

      const filenameEl = document.getElementById('fmFilename');
      if (!currentPost || currentPost.filename.includes('new-post')) {
        const slug = slugify(title);
        const dayPrefix = formatDate(new Date()).split(' ')[0];
        filenameEl.value = `${dayPrefix}-${slug || 'post'}.md`;
      }
    }

    function slugify(text) {
      return text
        .toString()
        .toLowerCase()
        .trim()
        .replace(/\s+/g, '-')
        .replace(/[^\w\u4e00-\u9fa5-]+/g, '')
        .replace(/--+/g, '-');
    }

    function formatDate(d) {
      const pad = n => String(n).padStart(2, '0');
      const year = d.getFullYear();
      const month = pad(d.getMonth() + 1);
      const day = pad(d.getDate());
      const hours = pad(d.getHours());
      const mins = pad(d.getMinutes());
      const secs = pad(d.getSeconds());
      return `${year}-${month}-${day} ${hours}:${mins}:${secs} +0800`;
    }

    function setCurrentTime() {
      document.getElementById('fmDate').value = formatDate(new Date());
    }

    // Toolbar Helpers
    function insertSyntax(before, after) {
      const textarea = document.getElementById('editorTextarea');
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const text = textarea.value;
      const selected = text.substring(start, end);

      const replacement = before + (selected || '範例內容') + after;
      textarea.value = text.substring(0, start) + replacement + text.substring(end);
      textarea.focus();
      textarea.selectionStart = start + before.length;
      textarea.selectionEnd = start + before.length + (selected ? selected.length : 4);

      renderPreview();
    }

    function insertTable() {
      const tableTpl = '\n| 欄位 1 | 欄位 2 | 欄位 3 |\n| :--- | :--- | :--- |\n| 項目 A | 內容 1 | 數值 |\n| 項目 B | 內容 2 | 數值 |\n\n';
      insertSyntax(tableTpl, '');
    }

    // Settings Modal
    async function openSettings() {
      document.getElementById('settingsModal').classList.add('active');
      const cfgRes = await fetch('/api/config');
      const cfg = await cfgRes.json();
      if (cfg.success) {
        document.getElementById('cfgRepo').value = cfg.repo || 'DL049/DL049.github.io';
        if (cfg.hasToken) {
          document.getElementById('cfgToken').placeholder = `已配置 (${cfg.maskedToken})`;
        }
      }

      try {
        const gitRes = await fetch('/api/git/status');
        const git = await gitRes.json();
        const box = document.getElementById('gitStatusBox');
        if (git.success) {
          box.innerText = `分支: ${git.branch}\n最新 Commit: ${git.lastCommit}\n未提交變更:\n${git.changes || '(無未提交變更)'}`;
        }
      } catch (e) {}
    }

    function closeSettings() {
      document.getElementById('settingsModal').classList.remove('active');
    }

    async function saveSettings() {
      const repo = document.getElementById('cfgRepo').value.trim();
      const token = document.getElementById('cfgToken').value.trim();

      const payload = { repo };
      if (token) payload.githubToken = token;

      try {
        const res = await fetch('/api/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.success) {
          Swal.fire('成功', '設定已儲存', 'success');
          closeSettings();
        }
      } catch (err) {
        Swal.fire('錯誤', err.message, 'error');
      }
    }

    // Jekyll Preview Controller
    async function checkPreviewStatus() {
      try {
        const res = await fetch('/api/preview/status');
        const data = await res.json();
        updatePreviewBtn(data.running);
      } catch (e) {}
    }

    function updatePreviewBtn(running) {
      isJekyllRunning = running;
      const btn = document.getElementById('btnPreviewToggle');
      if (running) {
        btn.innerHTML = `<i class="fa-solid fa-stop" style="color: #ef4444;"></i>`;
        btn.title = '停止本地 Jekyll 預覽服務';
      } else {
        btn.innerHTML = `<i class="fa-solid fa-play" style="color: #10b981;"></i>`;
        btn.title = '啟動本地 Jekyll 預覽服務 (http://localhost:4000)';
      }
    }

    async function toggleJekyllPreview() {
      const endpoint = isJekyllRunning ? '/api/preview/stop' : '/api/preview/start';
      try {
        const res = await fetch(endpoint, { method: 'POST' });
        const data = await res.json();
        if (data.success) {
          await checkPreviewStatus();
          if (!isJekyllRunning) {
            Swal.fire({
              icon: 'info',
              title: 'Jekyll 預覽已啟動',
              html: `正在本地啟動 Jekyll 服務，請訪問：<br><a href="http://127.0.0.1:4000" target="_blank" style="color: var(--link-color);">http://127.0.0.1:4000</a>`,
              timer: 4000
            });
          }
        }
      } catch (err) {
        Swal.fire('錯誤', err.message, 'error');
      }
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
</html>
